<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LRU 캐시 시뮬레이터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8;
            color: #334155;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 3rem;
            max-width: 800px;
            width: 100%;
        }
        .cache-container {
            display: flex;
            gap: 0.5rem;
            margin-top: 2rem;
            justify-content: center;
            flex-wrap: wrap;
            min-height: 100px; /* 캐시 아이템이 없을 때도 레이아웃 유지 */
        }
        .cache-item {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 6rem;
            height: 6rem;
            background-color: #e2e8f0;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.5rem;
            transition: all 0.3s ease-in-out;
            border: 2px solid transparent;
            position: relative;
        }
        .cache-item.added {
            animation: fadeIn 0.5s ease-out;
            background-color: #6ee7b7; /* green-300 */
            border-color: #10b981; /* green-500 */
        }
        .cache-item.hit {
            animation: pulse 1s infinite;
            background-color: #93c5fd; /* blue-300 */
            border-color: #3b82f6; /* blue-500 */
        }
        .cache-item.evicted {
            animation: fadeOut 0.5s ease-in;
            opacity: 0;
            transform: scale(0.8);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes fadeOut {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0; transform: scale(0.8); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .status-message {
            text-align: center;
            font-size: 1.25rem;
            margin-top: 1rem;
            font-weight: bold;
        }
        .status-miss {
            color: #ef4444; /* red-500 */
        }
        .status-hit {
            color: #22c55e; /* green-500 */
        }
        .info-panel {
            background-color: #f8fafc;
            border-radius: 8px;
            padding: 1.5rem;
            margin-top: 2rem;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="container bg-white p-8 rounded-xl shadow-lg">
        <h1 class="text-3xl font-bold text-center mb-6 text-gray-800">LRU 캐시 시뮬레이터</h1>
        
        <div class="flex flex-col items-center gap-4">
            <div class="flex items-center gap-4 w-full">
                <input id="keyInput" type="number" placeholder="캐시 키 입력 (숫자)" class="flex-1 p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all duration-300">
                <button id="putButton" class="bg-blue-600 text-white font-bold py-3 px-6 rounded-md shadow-md hover:bg-blue-700 transition-all duration-300">
                    PUT
                </button>
            </div>
            
            <div class="flex items-center gap-4 mt-2 w-full">
                <span class="text-gray-600 font-medium">캐시 용량:</span>
                <input id="capacityInput" type="number" value="5" min="1" max="10" class="w-20 p-2 border border-gray-300 rounded-md text-center focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all duration-300">
            </div>
        </div>
        
        <div id="cacheContainer" class="cache-container">
            <!-- Cache items will be rendered here -->
        </div>

        <div id="status" class="status-message mt-8"></div>
        
        <div class="info-panel mt-8">
            <h2 class="text-xl font-bold text-gray-700 mb-2">시뮬레이션 가이드</h2>
            <ul class="list-disc list-inside text-sm text-gray-600 space-y-1">
                <li>캐시 용량을 설정하고 `PUT` 버튼을 눌러 키를 추가하세요.</li>
                <li>이미 존재하는 키를 추가하면 캐시 히트가 발생하고, 해당 키가 가장 최근에 사용된 것으로 갱신됩니다.</li>
                <li>새로운 키를 추가하면 페이지 부재 (캐시 미스)가 발생합니다.</li>
                <li>캐시가 가득 찬 상태에서 페이지 부재가 발생하면, 가장 오래된(오른쪽 끝) 키가 제거됩니다.</li>
            </ul>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const keyInput = document.getElementById('keyInput');
            const putButton = document.getElementById('putButton');
            const capacityInput = document.getElementById('capacityInput');
            const cacheContainer = document.getElementById('cacheContainer');
            const statusDiv = document.getElementById('status');
            
            let lruList = []; // LRU 순서를 저장하는 배열
            let capacity = parseInt(capacityInput.value);
            
            // 캐시 용량 변경 이벤트 리스너
            capacityInput.addEventListener('change', () => {
                const newCapacity = parseInt(capacityInput.value);
                if (newCapacity > 0) {
                    capacity = newCapacity;
                    // 용량 변경 시 캐시 초기화
                    lruList = [];
                    renderCache();
                    statusDiv.innerHTML = '캐시 용량이 변경되었습니다. 다시 시작하세요.';
                    statusDiv.classList.add('text-blue-500');
                    statusDiv.classList.remove('status-hit', 'status-miss');
                }
            });

            // PUT 버튼 클릭 이벤트
            putButton.addEventListener('click', () => {
                const key = keyInput.value.trim();
                if (key === "") {
                    return;
                }
                put(key);
                keyInput.value = "";
                keyInput.focus();
            });

            // 엔터 키 이벤트
            keyInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    putButton.click();
                }
            });

            function put(key) {
                let isHit = false;
                let message = '';

                // lruList에서 해당 키가 존재하는지 확인 (캐시 히트)
                const existingIndex = lruList.indexOf(key);
                if (existingIndex !== -1) {
                    isHit = true;
                    message = `캐시 히트: 키 '${key}'`;
                    
                    // LRU 순서 갱신: 기존 위치에서 제거
                    lruList.splice(existingIndex, 1);
                    
                } else {
                    // 페이지 부재 (캐시 미스)
                    isHit = false;
                    message = `페이지 부재: 키 '${key}'`;
                    
                    if (lruList.length >= capacity) {
                        // 캐시 용량 초과: 가장 오래된 항목(마지막) 제거
                        const evictedKey = lruList.pop();
                        message += ` (키 '${evictedKey}' 제거됨)`;
                    }
                }
                
                // 새 항목을 가장 최근 위치(배열의 맨 앞)에 추가
                lruList.unshift(key);
                
                updateUI(message, isHit);
            }
            
            function updateUI(message, isHit) {
                // 상태 메시지 업데이트
                statusDiv.textContent = message;
                statusDiv.className = `status-message mt-8 ${isHit ? 'status-hit' : 'status-miss'}`;
                
                // 캐시 상태 렌더링
                renderCache(isHit);
            }

            function renderCache(isHit) {
                // 애니메이션을 위해 이전 아이템을 제거하고 다시 추가
                cacheContainer.innerHTML = '';
                
                lruList.forEach((key, index) => {
                    const cacheItem = document.createElement('div');
                    cacheItem.classList.add('cache-item', 'transition-all');
                    cacheItem.textContent = key;
                    
                    if (index === 0) {
                        cacheItem.classList.add(isHit ? 'hit' : 'added');
                    }
                    
                    cacheContainer.appendChild(cacheItem);
                });
            }
        });
    </script>
</body>
</html>
